name: cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1

license: CC-BY-4.0

dates:
  start: 2020-01-01T00:00:00
  end: 2020-01-07T21:00:00
  frequency: 3h

build:
  group_by: daily

statistics:
  allow_nans: true

input:
  join:
  # grib containing surface variables
  - grib:
      path: data/module-01_02/demo-cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1/demo-cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1_sfc.grib
  # grib containing pressure level variables
  - grib:
      path: data/module-01_02/demo-cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1/demo-cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1_pl.grib
  # grib containing accumulated variables
  - accumulate:
      period: 3h
      availability:
        - [0,  "0-3"]
        - [3,  "0-3"]
        - [6,  "0-3"]
        - [9,  "0-3"]
        - [12, "0-3"]
        - [15, "0-3"]
        - [18, "0-3"]
        - [21, "0-3"]
      source:
        grib-index:
          indexdb: data/module-01_02/demo-cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1/demo-cerra-rr-an-oper-0001-cdsapi-5p5km-20200101-20200107-3h-v1_acc_index.sqlite
  # constant forcings
  - constants:
      param:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - insolation
      template: ${input.join.0.grib}
